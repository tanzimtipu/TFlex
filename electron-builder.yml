# Phase 49 — the PRODUCT is Jovrel; the PROJECT stays TFlex.
# `appId` STAYS com.tflex.app on purpose: it is an INTERNAL identity, and
# electron-builder derives the NSIS upgrade GUID (UUID.v5 of appId + ns) from
# it. Changing it would register a SECOND product and orphan the old install;
# keeping it makes a Jovrel installer find and replace an existing TFlex
# install in place via the same Add/Remove Programs entry and install dir.
appId: com.tflex.app
productName: Jovrel
directories:
  output: release
# Phase 57 — installer-size gate (REQUIREMENTS.md:82, under 150 MB). The
# renderer-only `files:` exclusions below shrank app.asar from ~302 MB to
# ~208 MB but the LZMA-compressed NSIS installer only dropped to ~166 MB,
# still over budget. `maximum` switches NSIS/7z to the strongest compression
# so the remaining app payload packs tighter. It only changes pack time, not
# which files ship.
compression: maximum
files:
  - dist/**
  - assets/**
  - package.json
  # Phase 57 — dev-only artifacts inside the packages that DO ship. Source maps
  # and TypeScript sources are never loaded by Node at runtime (Node executes
  # only the emitted .js/.cjs/.mjs); they were ~20 MB and ~7 MB of uncompressed
  # app.asar respectively. Dropping them shaves the remaining bytes needed to
  # get the installer under 150 MB without touching any runtime dependency.
  - "!**/*.map"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.cts"
  - "!node_modules/**/*.mts"
  - "!node_modules/**/*.tsbuildinfo"
  # Renderer-only dependency trees — NEVER shipped in app.asar. Vite inlines
  # every renderer import into dist/renderer at build time, so these packages
  # are dead weight in the packaged app. Excluding them is what brings the
  # NSIS installer under the 150 MB budget (REQUIREMENTS.md:82). Verified by
  # grep: none is imported under src/main or src/preload. pdfjs-dist is
  # renderer-only and its worker is copied into dist/renderer by Vite
  # (src/renderer/pdf/pdfjs.ts:8 does `?url` on the worker module).
  - "!node_modules/pdfjs-dist/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/motion/**"
  - "!node_modules/@fontsource-variable/**"
  # @napi-rs/canvas is a transitive of the excluded renderer-only pdfjs-dist
  # (pdfjs-dist@4.10.38 depends on @napi-rs/canvas@0.1.100) and of the
  # project's own devDependency @napi-rs/canvas; src/ imports it nowhere.
  # It is a ~36 MB win32-x64 native binary. NOTE: @napi-rs/keyring (also under
  # @napi-rs) is a runtime dep of the MAIN process's @neondatabase/neon-js and
  # MUST keep shipping, so only the canvas package trees are excluded.
  - "!node_modules/@napi-rs/canvas/**"
  - "!node_modules/@napi-rs/canvas-*/**"
  # @neondatabase/auth (and its transitive renderer-only deps @neondatabase/auth-ui
  # and @triplit) is imported ONLY at src/renderer/accounts/adapter.ts:13-14.
  # The main process uses a DIFFERENT package, @neondatabase/neon-js
  # (src/main/services/accounts/transport.ts:16), which must KEEP shipping.
  - "!node_modules/@neondatabase/auth/**"
  - "!node_modules/@neondatabase/auth-ui/**"
  - "!node_modules/@triplit/**"
  # Phase 57 — transitive leaves of the renderer-only trees above.
  # electron-builder applies negative `files` patterns to the named directory
  # only; it does NOT prune a package's transitive dependency closure, so the
  # excluded roots above leave their leaves behind in app.asar. Every package
  # below was computed to be reachable ONLY through an excluded renderer-only
  # root (production dependency graph walked with those roots cut), and none is
  # referenced in the built dist/main/index.js or dist/preload/preload.cjs. The
  # main process's ONLY external node_modules require is tesseract.js (verified
  # by scanning the built bundle), so pruning these cannot break main/preload.
  # These are the better-auth / auth-UI / @triplit / react-email UI stacks.
  - "!node_modules/@babel/**"
  - "!node_modules/@better-auth/**"
  - "!node_modules/@better-fetch/**"
  - "!node_modules/@captchafox/**"
  - "!node_modules/@daveyplate/**"
  - "!node_modules/@floating-ui/**"
  - "!node_modules/@hcaptcha/**"
  - "!node_modules/@hexagon/**"
  - "!node_modules/@hookform/**"
  - "!node_modules/@levischuck/**"
  - "!node_modules/@marsidev/**"
  - "!node_modules/@noble/**"
  - "!node_modules/@opentelemetry/**"
  - "!node_modules/@peculiar/**"
  - "!node_modules/@radix-ui/**"
  - "!node_modules/@react-email/**"
  - "!node_modules/@selderee/**"
  - "!node_modules/@simplewebauthn/**"
  - "!node_modules/@standard-schema/**"
  - "!node_modules/@wojtekmaj/**"
  # @supabase is a partial scope: postgrest-js is a main-process dependency of
  # @neondatabase/neon-js and must KEEP shipping, so only auth-js is excluded.
  - "!node_modules/@supabase/auth-js/**"
  - "!node_modules/framer-motion/**"
  - "!node_modules/motion-dom/**"
  - "!node_modules/better-auth/**"
  - "!node_modules/prismjs/**"
  - "!node_modules/react-hook-form/**"
  - "!node_modules/ua-parser-js/**"
  - "!node_modules/tailwind-merge/**"
  - "!node_modules/tailwindcss/**"
  - "!node_modules/kysely/**"
  - "!node_modules/better-call/**"
  - "!node_modules/entities/**"
  - "!node_modules/qrcode-generator/**"
  - "!node_modules/bowser/**"
  - "!node_modules/asn1js/**"
  - "!node_modules/htmlparser2/**"
  - "!node_modules/vaul/**"
  - "!node_modules/reflect-metadata/**"
  - "!node_modules/sonner/**"
  - "!node_modules/html-to-text/**"
  - "!node_modules/tsyringe/**"
  - "!node_modules/domutils/**"
  - "!node_modules/jose/**"
  - "!node_modules/input-otp/**"
  - "!node_modules/motion-utils/**"
  - "!node_modules/prop-types/**"
  - "!node_modules/scheduler/**"
  - "!node_modules/react-remove-scroll/**"
  - "!node_modules/domhandler/**"
  - "!node_modules/hoist-non-react-statics/**"
  - "!node_modules/react-google-recaptcha/**"
  - "!node_modules/react-async-script/**"
  - "!node_modules/tw-animate-css/**"
  - "!node_modules/peberminta/**"
  - "!node_modules/selderee/**"
  - "!node_modules/pvtsutils/**"
  - "!node_modules/use-callback-ref/**"
  - "!node_modules/parseley/**"
  - "!node_modules/use-sidecar/**"
  - "!node_modules/sprintf-js/**"
  - "!node_modules/pvutils/**"
  - "!node_modules/aria-hidden/**"
  - "!node_modules/react-is/**"
  - "!node_modules/dom-serializer/**"
  - "!node_modules/rou3/**"
  - "!node_modules/nanostores/**"
  - "!node_modules/class-variance-authority/**"
  - "!node_modules/react-remove-scroll-bar/**"
  - "!node_modules/set-cookie-parser/**"
  - "!node_modules/react-qr-code/**"
  - "!node_modules/detect-europe-js/**"
  - "!node_modules/deepmerge/**"
  - "!node_modules/react-style-singleton/**"
  - "!node_modules/defu/**"
  - "!node_modules/next-themes/**"
  - "!node_modules/domelementtype/**"
  - "!node_modules/leac/**"
  - "!node_modules/loose-envify/**"
  - "!node_modules/clsx/**"
  - "!node_modules/is-standalone-pwa/**"
  - "!node_modules/warning/**"
  - "!node_modules/object-assign/**"
  - "!node_modules/ua-is-frozen/**"
  - "!node_modules/js-tokens/**"
  - "!node_modules/get-nonce/**"
  - "!node_modules/detect-node-es/**"
win:
  # Phase 49 — the application icon (window/taskbar/executable). Resolved
  # from the project root like every other path here; the brand assets ship
  # via the `assets/**` files rule above.
  icon: assets/brand/jovrel.ico
  # Phase 38 item A — x64 ONLY (operator ruling 2026-09-25: 32-bit is DEFERRED).
  # Electron 44 publishes no win32-ia32 binary upstream (electron-v44.0.0-win32-ia32.zip
  # 404s; the local checksums.json lists only x64/arm64 for win32), so an ia32
  # installer cannot be produced without repinning the runtime — which the operator
  # chose not to do. `arch: x64` is stated explicitly (rather than omitted) so the
  # intent is in the config and an `ia32` entry can be added back later without any
  # artifact renaming: the `${arch}` token stays load-bearing in the names below.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # Phase 35 / Phase 49 — register Jovrel as a .pdf handler so it appears in
  # Explorer's "Open with" list and can be chosen as the default PDF app in
  # Windows Settings. `name` is the ProgID / file class (electron-builder
  # passes it straight to the NSIS APP_ASSOCIATE macro as FILECLASS);
  # `description` is the class description shown to the shell. Phase 49 sets
  # an explicit per-extension `icon` (the Jovrel PDF file-type icon) instead
  # of inheriting the application icon. This never sets the Windows default
  # handler on its own — the user picks that in Settings.
  fileAssociations:
    - ext: pdf
      name: Jovrel.pdf
      description: Jovrel PDF Document
      icon: assets/brand/jovrel-pdf.ico
# Phase 13 review — borderless / frameless NSIS installer is NOT supportable
# via electron-builder, and the limit is recorded here honestly:
#
#   - electron-builder exposes no `frame`/`titleBarStyle` analog for the
#     installer window. The NSIS wizard (MUI2) is a standard Win32 dialog with
#     a fixed OS title bar; that chrome cannot be removed from config.
#   - There is NO stylesheet theming for the installer UI. The only visual
#     customisations are bitmaps (`installerIcon`, `uninstallerIcon`,
#     `installerHeader`, `installerSidebar`, `uninstallerSidebar`) and the
#     language selector (`displayLanguageSelector`, `installerLanguages`).
#   - A custom NSIS include script (`nsis.include` -> a `.nsh` that is
#     `!include`d) can add extra `nsDialogs` pages and run arbitrary NSIS
#     commands, but every page is still a standard Win32 dialog with a title
#     bar. It cannot make the wizard frameless.
#   - A truly borderless installer would require replacing the entire NSIS
#     UI executable (a custom-skinned installer host), which electron-builder
#     does not expose. Out of scope for v1; the installer keeps its native
#     frame. Only the runtime app window is frameless (see src/main/window.ts).
nsis:
  # Phase 38 item A — real per-machine install (INSTALL_MODE_PER_ALL_USERS_REQUIRED).
  # This is what moves the install from the per-user %LOCALAPPDATA%\Programs\TFlex
  # to the standard Program Files location, with the normal UAC elevation prompt
  # (RequestExecutionLevel admin), a per-machine Add/Remove Programs entry
  # (HKLM) and an uninstaller in the install folder:
  #   x64 build -> $PROGRAMFILES64\Jovrel = C:\Program Files\Jovrel
  # (the ia32 -> $PROGRAMFILES\Jovrel WOW64 path is deferred with the ia32 target;
  # it returns unchanged if the runtime is ever repinned with a 32-bit binary.)
  # `allowElevation` lets the assisted installer offer elevation for the
  # install; `packElevateHelper` below packs resources/elevate.exe so the
  # electron-updater OTA path can re-run the installer elevated over a
  # Program Files install.
  oneClick: false
  perMachine: true
  allowElevation: true
  # Explicitly true: for an assisted (oneClick:false) per-machine installer the
  # builder writes `isAdminRightsRequired: true` into latest.yml only when this
  # is truthy (NsisTarget: `oneClick || packElevateHelper`); leaving it unset
  # made the built 1.29.0-x64 latest.yml omit the flag. With it set the updater
  # takes the deterministic resources/elevate.exe path instead of relying on
  # the EACCES retry fallback.
  packElevateHelper: true
  allowToChangeInstallationDirectory: true
  # Phase 49 — Jovrel brand icons for the installer and the uninstaller
  # (electron-builder accepts the same .ico for both).
  installerIcon: assets/brand/jovrel.ico
  uninstallerIcon: assets/brand/jovrel.ico
  # Phase 38 item A (operator ruling 2026-09-25) — remove the LEGACY per-user
  # install (pre-1.30: %LOCALAPPDATA%\Programs\TFlex, an HKCU uninstall entry
  # and an HKCU TFlex.pdf ProgID) when this per-machine installer runs, so a
  # machine never keeps two copies. The hook is the documented electron-builder
  # `customInstall` macro, defined in the include below — not a hand-edit of
  # generated output. `electron-builder.nsh` sits next to this file and is
  # resolved by electron-builder's project-dir fallback.
  include: electron-builder.nsh
  # Phase 38 item A — the architecture is IN the artifact name so the NSIS
  # installers cannot overwrite each other. The token is literally `x64` (and
  # `ia32` if it ever returns) — electron-builder's Arch names, which is also
  # what electron-updater's findFile() matches against process.arch. See the
  # feed notes below.
  artifactName: Jovrel-Setup-${version}-${arch}.${ext}
portable:
  artifactName: Jovrel-${version}-portable-${arch}.${ext}
# Publish target for GitHub Releases. `npm run dist` passes `--publish never`
# so artifacts are built locally without uploading; the operator publishes by
# running `electron-builder --publish onTag` (or `always`) with `GH_TOKEN` set,
# or via the GitHub Actions release workflow.
#
# When published, electron-builder uploads these release assets to the GitHub
# release for the matching git tag (vMAJOR.MINOR.PATCH):
#   Jovrel-Setup-<version>-x64.exe           — x64 NSIS installer (auto-updateable)
#   Jovrel-Setup-<version>-x64.exe.blockmap  — x64 differential update blockmap
#   latest.yml                              — the SINGLE update feed manifest
#                                             consumed by electron-updater
#   Jovrel-<version>-portable-x64.exe        — portable x64 (direct download)
# (32-bit artifacts are deferred per the 2026-09-25 operator ruling; if ia32
# returns, the same four names gain an -ia32 twin and latest.yml lists both.)
#
# Phase 38 feed facts — verified against the installed electron-builder 26.x and
# electron-updater 6.x source, and by the published metadata of the build:
#   - On Windows electron-builder emits exactly ONE metadata file, `latest.yml`,
#     regardless of architecture: updateInfoBuilder.getArchPrefixForUpdateFile()
#     returns "" unless the platform is Linux. There is NO `latest-ia32.yml`.
#   - That one file lists every installer in its `files:` array (electron-builder
#     merges the per-arch update-info tasks into the same channel file).
#   - At runtime BOTH archs request the same URL, `latest.yml`. The correct file
#     is then chosen by NsisUpdater -> findFile(files, "exe"), which prefers the
#     entry whose URL contains `process.arch`. This ONLY works because the
#     artifact names above end in `-x64` (and would end in `-ia32`): an installed
#     x64 build requests the x64 installer. Renaming the artifacts without that
#     arch token would break OTA silently.
#   - Because this is a per-machine install with packElevateHelper: true,
#     electron-builder sets `isAdminRightsRequired: true` on the installer's
#     files[] entry (verified in the built latest.yml). electron-updater then
#     re-runs the downloaded installer via the packed resources/elevate.exe, so
#     the OTA update over C:\Program Files prompts UAC and succeeds.
# The portable builds are built but NOT listed in latest.yml — they are not
# auto-updateable (see isPortableBuild() in update-service.ts).
#
# Release artifacts are published to a SEPARATE PUBLIC repo (`tflex-releases`)
# so end users can check for and download updates WITHOUT a token — the source
# repo (this one) stays private. electron-builder reads the publish token from
# the `GH_TOKEN` / `GITHUB_TOKEN` env var at BUILD time (still required to
# upload assets via the API). The in-app RUNTIME token `TFLEX_GH_TOKEN`
# (fallback `GH_TOKEN`) is now OPTIONAL — it only authenticates the
# update-check API calls for higher rate limits; users never set it. See
# update-service.ts. The `repo` below MUST match RELEASES_REPO there.
publish:
  provider: github
  owner: tanzimtipu
  repo: tflex-releases
