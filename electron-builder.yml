appId: com.tflex.app
productName: TFlex
directories:
  output: release
files:
  - dist/**
  - assets/**
  - package.json
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: TFlex-Setup-${version}.${ext}
portable:
  artifactName: TFlex-${version}-portable.${ext}
