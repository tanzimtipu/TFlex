<script>
(()=>{const config={"category": "Search and Command Palette", "slug": "search-command-palette", "kind": "search", "primary": "Command Lens", "alternative": "Search Drawer"};const root=document.getElementById('jr-search-command-palette');const prototype=root.querySelector(`template[data-prototype="${config.kind}"]`);const previews=[];
root.querySelectorAll('.ux-product').forEach((p,index)=>{p.append(prototype.content.cloneNode(true));p.classList.add('ux-kind-'+config.kind);p.setAttribute('aria-label',index?config.alternative:config.primary);p.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));let restore=()=>{};function save(x){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{category:config.category,design:p.dataset.design,...x},privateContent:null}).catch(()=>{});}function q(s){return p.querySelector(s);}function qa(s){return [...p.querySelectorAll(s)];}
if(config.kind==='search'){let mode='tools',query='',match=0;const commands=[['Rotate pages','Pages','rotate-cw'],['Extract pages','Pages','file-output'],['Recognize text','Edit','scan-text'],['Find in document','View','search'],['Preferences','Application','settings']];function render(){q('[data-tools]').hidden=mode!=='tools';q('[data-find]').hidden=mode!=='find';qa('[data-search-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.searchView===mode)));q('[data-results]').replaceChildren();const found=commands.filter(c=>c[0].toLowerCase().includes(query.toLowerCase()));found.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.innerHTML=`<i data-lucide="${c[2]}" aria-hidden="true"></i><span>${c[0]}<small>${c[1]}</small></span>`;b.onclick=()=>{q('[data-search-status]').textContent=c[0]+' selected';save({mode,query,command:c[0]});};q('[data-results]').append(b);});if(!found.length)q('[data-results]').textContent='No matching tools';const find=q('[data-find-query]').value.trim();const visible=qa('[data-match]').filter(b=>find&&b.textContent.toLowerCase().includes(find.toLowerCase()));if(visible.length&&!visible.some(b=>+b.dataset.match===match))match=+visible[0].dataset.match;qa('[data-match]').forEach(b=>{b.hidden=!visible.includes(b);b.setAttribute('aria-pressed',String(+b.dataset.match===match));});qa('[data-match-step]').forEach(b=>b.disabled=!visible.length);q('[data-matches]').textContent=visible.length?`Match ${visible.findIndex(b=>+b.dataset.match===match)+1} of ${visible.length}`:'No matches';if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});}qa('[data-search-view]').forEach(b=>b.onclick=()=>{mode=b.dataset.searchView;render();save({mode,query,match});});q('[data-query]').oninput=e=>{query=e.target.value;render();save({mode,query,match});};q('[data-find-query]').oninput=()=>{match=0;render();};qa('[data-match-step]').forEach(b=>b.onclick=()=>{const ids=qa('[data-match]').filter(x=>!x.hidden).map(x=>+x.dataset.match);if(!ids.length)return;match=ids[(ids.indexOf(match)+ +b.dataset.matchStep+ids.length)%ids.length];render();save({mode,query,match});});qa('[data-match]').forEach(b=>b.onclick=()=>{match=+b.dataset.match;render();q('[data-search-status]').textContent='Viewing match on page '+[2,4,6][match];save({mode,query,match});});restore=x=>{mode=x.mode==='find'?'find':'tools';query=typeof x.query==='string'?x.query:'';match=Number.isInteger(x.match)?Math.max(0,Math.min(2,x.match)):0;q('[data-query]').value=query;render();};render();}
if(config.kind==='feedback'){let value=4,state='Running';function render(){q('progress').value=value;q('[data-progress-label]').textContent=`${value} of 12 pages`;q('[data-progress-percent]').textContent=Math.round(value/12*100)+'%';q('[data-job-state]').textContent=state;q('[data-job-state]').dataset.state=state;q('[data-job-status]').textContent=state==='Failed'?'Recognition failed. You can retry.':state==='Completed'?'Text recognition completed.':state==='Cancelled'?'Recognition cancelled.':'Text recognition is running.';q('[data-cancel-job]').disabled=state!=='Running';q('[data-advance-job]').disabled=state!=='Running';q('[data-retry-job]').hidden=!['Failed','Cancelled'].includes(state);}q('[data-advance-job]').onclick=()=>{value=Math.min(12,value+4);if(value===12)state='Completed';render();save({value,state});};q('[data-cancel-job]').onclick=()=>{state='Cancelled';render();save({value,state});};q('[data-fail-job]').onclick=()=>{state='Failed';render();save({value,state});};q('[data-retry-job]').onclick=()=>{value=0;state='Running';render();save({value,state});};q('[data-dismiss-notice]').onclick=()=>q('[data-notice]').hidden=true;restore=x=>{value=Math.max(0,Math.min(12,+x.value||0));state=['Running','Failed','Cancelled','Completed'].includes(x.state)?x.state:'Running';render();};render();}
if(config.kind==='preferences'){function section(name){q('[data-appearance]').hidden=name!=='appearance';q('[data-workspace]').hidden=name!=='workspace';qa('[data-setting-section]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.settingSection===name)));}qa('[data-setting-section]').forEach(b=>b.onclick=()=>section(b.dataset.settingSection));q('[data-theme-preference]').onchange=e=>{p.style.colorScheme=e.target.value==='system'?'':e.target.value;q('[data-preferences-status]').textContent='Theme preview updated';save({theme:e.target.value,motion:q('[data-motion]').checked});};q('[data-motion]').onchange=()=>{q('[data-preferences-status]').textContent='Home motion preference updated';save({theme:q('[data-theme-preference]').value,motion:q('[data-motion]').checked});};q('[data-reset-preferences]').onclick=()=>{q('[data-theme-preference]').value='system';p.style.colorScheme='';qa('input[type=checkbox]').forEach(x=>x.checked=true);q('[data-navigation-layout]').selectedIndex=0;q('[data-preferences-status]').textContent='Preview defaults restored';};restore=x=>{if(['system','light','dark'].includes(x.theme)){q('[data-theme-preference]').value=x.theme;p.style.colorScheme=x.theme==='system'?'':x.theme;}if(typeof x.motion==='boolean')q('[data-motion]').checked=x.motion;};}
if(config.kind==='forms'){function render(){const name=q('[data-name]').value.trim(),email=q('[data-email]').value.trim();let count=Number(!!name)+Number(!!email&&q('[data-email]').validity.valid);q('[data-form-count]').textContent=`${count} of 2 required`;return count;}qa('.ux-form-fields input').forEach(x=>x.oninput=()=>{render();q('[data-form-error]').hidden=true;x.removeAttribute('aria-invalid');});q('[data-check-form]').onclick=()=>{const count=render();qa('[required]').forEach(x=>x.setAttribute('aria-invalid',String(!x.value.trim()||!x.validity.valid)));q('[data-form-error]').hidden=count===2;q('[data-form-error]').textContent=!q('[data-name]').value.trim()?'Enter a full name.':'Enter a valid email address.';q('[data-form-status]').textContent=count===2?'Required fields are complete.':'Some required fields need attention.';if(count!==2)q('[aria-invalid=true]').focus();save({requiredComplete:count===2});};render();}
if(config.kind==='comments'){let filter='all',resolved=false,resolvedSecond=true,replies=0;function render(){q('[data-thread=open]').hidden=filter==='open'&&resolved;q('[data-thread=resolved]').hidden=filter==='open'&&resolvedSecond;q('[data-thread=resolved] .ux-badge').textContent=resolvedSecond?'Resolved':'Open';q('[data-reopen]').textContent=resolvedSecond?'Reopen':'Resolve';q('[data-resolve]').textContent=resolved?'Reopen':'Resolve';qa('[data-comment-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.commentFilter===filter)));q('[data-comments-status]').textContent=`2 comments · ${Number(!resolved)+Number(!resolvedSecond)} open`;}qa('[data-comment-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.commentFilter;render();save({filter,resolved,resolvedSecond});});q('[data-resolve]').onclick=()=>{resolved=!resolved;render();save({filter,resolved,resolvedSecond});};q('[data-reopen]').onclick=()=>{resolvedSecond=!resolvedSecond;render();save({filter,resolved,resolvedSecond});};q('[data-post-reply]').onclick=()=>{const v=q('[data-reply]').value.trim();if(!v)return;const item=document.createElement('p');item.className='ux-reply';item.textContent=v;q('[data-replies]').append(item);q('[data-reply]').value='';replies++;q('[data-comments-status]').textContent='Reply added';save({filter,resolved,replies});};q('[data-select-comment]').onclick=()=>q('[data-comments-status]').textContent='Comment anchor: page 4';restore=x=>{filter=x.filter==='open'?'open':'all';resolved=!!x.resolved;resolvedSecond=typeof x.resolvedSecond==='boolean'?x.resolvedSecond:true;render();};render();}
if(config.kind==='selection'){let selected=true,committed='A considered document',draft=committed;function render(){q('[data-object-toggle]').setAttribute('aria-pressed',String(selected));q('[data-object-controls]').hidden=!selected;q('[data-object-text]').textContent=draft||'Text';}q('[data-object-toggle]').onclick=()=>{selected=!selected;render();save({selected});};q('[data-object-input]').oninput=e=>{draft=e.target.value;render();};q('[data-format-object]').onclick=()=>{const b=q('[data-format-object]'),on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));q('[data-object-text]').style.fontWeight=on?'500':'400';};q('[data-cancel-object]').onclick=()=>{draft=committed;q('[data-object-input]').value=draft;render();q('[data-object-status]').textContent='Draft text reverted.';};q('[data-apply-object]').onclick=()=>{committed=draft;q('[data-object-status]').textContent='Text applied in the preview.';save({selected});};restore=x=>{selected=typeof x.selected==='boolean'?x.selected:true;render();};render();}
if(config.kind==='import'){let entries=[{name:'report.pdf',type:'PDF'}];function render(){q('[data-import-list]').replaceChildren();entries.forEach((x,i)=>{const row=document.createElement('div');row.className='ux-import-row';const icon=document.createElement('i');icon.dataset.lucide='file';icon.setAttribute('aria-hidden','true');const content=document.createElement('div'),name=document.createElement('strong'),meta=document.createElement('small');name.textContent=x.name;meta.textContent=x.type+' · Selected';content.append(name,meta);const b=document.createElement('button');b.type='button';b.textContent='Remove';b.className='cursor-interaction';b.onclick=()=>{entries.splice(i,1);render();};row.append(icon,content,b);q('[data-import-list]').append(row);});q('[data-import-status]').textContent=`${entries.length} file${entries.length===1?'':'s'} selected`;q('[data-open-import]').disabled=!entries.length;const imagesOnly=entries.length&&entries.every(x=>x.type==='Image');q('[data-import-mode]').disabled=!imagesOnly;if(!imagesOnly)q('[data-import-mode]').selectedIndex=0;if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});}function add(files){entries=[...files].map(f=>({name:f.name,type:/\.(png|jpe?g)$/i.test(f.name)?'Image':/\.pdf$/i.test(f.name)?'PDF':'Other'}));render();}q('[data-files]').onchange=e=>add(e.target.files);q('[data-dropzone]').ondragover=e=>e.preventDefault();q('[data-dropzone]').ondrop=e=>{e.preventDefault();add(e.dataTransfer.files);};q('[data-open-import]').onclick=()=>{q('[data-import-status]').textContent='Selection ready for '+q('[data-import-mode]').value.toLowerCase()+'.';save({fileCount:entries.length,mode:q('[data-import-mode]').value});};render();}
if(config.kind==='adaptive'){let mode='comfortable',stage='Pages',panelVisible=true;const shell=q('.ux-app-shell');function render(){shell.classList.toggle('ux-compact',mode==='compact');shell.classList.toggle('ux-focus',mode==='focus');q('aside').hidden=!panelVisible||mode==='focus';shell.classList.toggle('ux-no-panel',!panelVisible||mode==='focus');q('[data-fit-panel-reopen]').hidden=panelVisible&&mode!=='focus';q('[data-fit-panel-title]').textContent=stage;q('[data-fit-label]').textContent=mode[0].toUpperCase()+mode.slice(1);q('[data-fit-status]').textContent=stage+' workspace';qa('[data-fit-stage]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.fitStage===stage)));}q('[data-fit-mode]').onchange=e=>{mode=e.target.value;render();save({mode,stage,panelVisible});};qa('[data-fit-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.fitStage;render();save({mode,stage,panelVisible});});q('[data-fit-panel-toggle]').onclick=()=>{panelVisible=false;render();};q('[data-fit-panel-reopen]').onclick=()=>{panelVisible=true;if(mode==='focus'){mode='comfortable';q('[data-fit-mode]').value=mode;}render();};q('[data-contrast]').onchange=e=>shell.classList.toggle('ux-contrast',e.target.checked);restore=x=>{mode=['comfortable','compact','focus'].includes(x.mode)?x.mode:'comfortable';stage=['Pages','Edit','Review','Deliver'].includes(x.stage)?x.stage:'Pages';panelVisible=typeof x.panelVisible==='boolean'?x.panelVisible:true;q('[data-fit-mode]').value=mode;render();};render();}
if(config.kind==='print'){function render(){const value=q('[data-output-range]').value.trim();const pages=[];let valid=!!value;for(const part of value.split(',')){const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m){valid=false;break;}const a=+m[1],b=m[2]?+m[2]:a;if(a<1||b>34||b<a){valid=false;break;}for(let n=a;n<=b;n++)pages.push(n);}const copies=q('[data-output-copies]');const validCopies=copies.validity.valid&&!!copies.value;const print=q('[data-output-mode]').value==='print';copies.closest('label').hidden=!print;q('[data-output-error]').hidden=valid&&(!print||validCopies);q('[data-output-error]').textContent=valid?'Enter a whole number of copies from 1 to 99.':'Use pages 1–34, for example 1-3, 5.';q('[data-output-range]').setAttribute('aria-invalid',String(!valid));q('[data-output-status]').textContent=valid?`${pages.length} page${pages.length===1?'':'s'} selected`:'Check the page range';q('[data-output-preview-label]').textContent=valid?'Page '+pages[0]:'Preview unavailable';q('[data-output-continue]').textContent=print?'Continue to print':'Continue to export';q('[data-output-continue]').disabled=!valid||(print&&!validCopies);}qa('.ux-output-settings input,.ux-output-settings select').forEach(x=>{x.oninput=render;x.onchange=render;});q('[data-output-continue]').onclick=()=>{q('[data-output-status]').textContent='Output settings ready. No job submitted by this preview.';save({mode:q('[data-output-mode]').value,range:q('[data-output-range]').value});};restore=x=>{if(['print','export'].includes(x.mode))q('[data-output-mode]').value=x.mode;if(typeof x.range==='string')q('[data-output-range]').value=x.range;render();};render();}
