<div id="jovrel-document-rail" aria-label="Jovrel top bar and tabs concepts">
  <style>
    #jovrel-document-rail { --jt-surface:light-dark(#fff,#20232b);--jt-canvas:light-dark(#f5f6f8,#171a21);--jt-ink:light-dark(#485164,#b8c0d0);--jt-strong:light-dark(#232a38,#eef1f7);--jt-muted:light-dark(#70798a,#929bac);--jt-border:light-dark(#e1e4eb,#3b414e);--jt-accent:light-dark(#7050d6,#b9a4ff);--jt-soft:light-dark(#f0ebfc,#302740);font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;color:var(--jt-ink); }
    #jovrel-document-rail * { box-sizing:border-box; }
    #jovrel-document-rail [hidden] { display:none!important; }
    #jovrel-document-rail .jt-stage { min-height:560px;padding:24px 8px 16px; }
    #jovrel-document-rail .jt-window { background:var(--jt-canvas);border:1px solid var(--jt-border);border-radius:14px; }
    #jovrel-document-rail button { display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:6px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:inherit;font:500 12px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;transition:background 140ms,color 140ms;max-width:100%; }
    #jovrel-document-rail button:hover:not(:disabled) { background:var(--jt-canvas);color:var(--jt-strong); }
    #jovrel-document-rail button:disabled { color:var(--jt-muted); }
    #jovrel-document-rail [data-lucide],#jovrel-document-rail .jt-vector { width:16px;height:16px;stroke-width:1.65;flex-shrink:0; }
    #jovrel-document-rail .jt-titlebar { display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 8px;background:var(--jt-surface);border-radius:14px 14px 0 0; }
    #jovrel-document-rail .jt-brand { font-weight:500;color:var(--jt-strong);padding:0 8px; }
    #jovrel-document-rail .jt-divider { width:1px;height:20px;background:var(--jt-border);margin:0 4px;flex-shrink:0; }
    #jovrel-document-rail .jt-app-actions { display:flex;align-items:center;gap:4px;flex-wrap:wrap; }
    #jovrel-document-rail .jt-title-spacer { flex:1;min-width:32px; }
    #jovrel-document-rail .jt-utility { display:flex;align-items:center;gap:4px; }
    #jovrel-document-rail .jt-secondary { border-color:var(--jt-border); }
    #jovrel-document-rail .jt-square { min-width:32px;width:32px;padding:6px; }
    #jovrel-document-rail .jt-caption { display:flex;align-items:center;min-width:126px; }
    #jovrel-document-rail .jt-caption button { border-radius:0;min-width:42px;pointer-events:none; }
    #jovrel-document-rail .jt-tabrow { padding:6px 8px 0;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--jt-border);background:var(--jt-canvas); }
    #jovrel-document-rail .jt-tablist { display:flex;align-items:stretch;gap:4px;min-width:0;flex:1; }
    #jovrel-document-rail .jt-tab { position:relative;display:flex;align-items:center;gap:2px;min-width:0;flex:1;max-width:220px;background:var(--tab-tint);color:var(--jt-strong);border:1px solid color-mix(in srgb,var(--tab-color) 35%,var(--jt-border));border-radius:9px 9px 0 0; }
    #jovrel-document-rail .jt-tab.is-active { background:var(--tab-color);border-color:var(--tab-color);border-bottom-color:var(--tab-color);color:var(--tab-on); }
    #jovrel-document-rail .jt-tab.is-active:before { content:'';position:absolute;top:0;left:10px;right:10px;height:var(--jt-keyline,2px);background:var(--tab-on);border-radius:2px; }
    #jovrel-document-rail .jt-tab-main { flex:1;min-width:0;justify-content:flex-start;min-height:38px;padding:8px 10px; }
    #jovrel-document-rail .jt-tab.is-active button:hover { background:color-mix(in srgb,var(--tab-color) 85%,var(--tab-on));color:var(--tab-on); }
    #jovrel-document-rail .jt-tab-name { min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    #jovrel-document-rail .jt-tab-close { min-width:28px;width:28px;padding:4px;margin-right:4px; }
    #jovrel-document-rail .jt-tab-close [data-lucide],#jovrel-document-rail .jt-tab-close .jt-vector { width:14px;height:14px; }
    #jovrel-document-rail .jt-dirty { width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0; }
    #jovrel-document-rail .jt-home.is-active { color:var(--jt-accent);background:var(--jt-soft); }
    #jovrel-document-rail .jt-tab-actions { display:flex;align-items:center;gap:4px; }
    #jovrel-document-rail .jt-list-count { font-variant-numeric:tabular-nums; }
    #jovrel-document-rail .jt-content { padding:28px;min-height:280px; }
    #jovrel-document-rail .jt-contextline { display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:12px;color:var(--jt-muted); }
    #jovrel-document-rail .jt-paper { max-width:430px;margin:0 auto;background:var(--jt-surface);padding:24px;min-height:180px;box-shadow:0 2px 12px light-dark(#232a3808,#00000018); }
    #jovrel-document-rail .jt-paper h3 { font-size:20px;font-weight:500;color:var(--jt-strong);margin:0 0 18px; }
    #jovrel-document-rail .jt-paper p { font-size:12px;line-height:1.6; }
    #jovrel-document-rail .jt-file-menu { background:var(--jt-surface);border:1px solid var(--jt-border);border-radius:14px;padding:12px;margin:12px 8px; }
    #jovrel-document-rail .jt-file-menu h3 { font-size:14px;font-weight:500;margin:0 0 10px;color:var(--jt-strong); }
    #jovrel-document-rail .jt-file-menu-list { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px; }
    #jovrel-document-rail .jt-file-menu-list button { justify-content:flex-start;min-width:0; }
    #jovrel-document-rail .jt-list-entry { display:flex;align-items:center;gap:8px;width:100%; }
    #jovrel-document-rail .jt-entry-name { flex:1;min-width:0;overflow-wrap:anywhere;text-align:left; }
    #jovrel-document-rail .jt-entry-detail { font-size:11px;color:var(--jt-muted); }
    #jovrel-document-rail .jt-status { margin-top:12px;font-size:12px;color:var(--jt-muted);min-height:20px; }
    #jovrel-document-rail .jt-inline .jt-titlebar { flex-wrap:wrap; }
    #jovrel-document-rail .jt-inline .jt-titlebar .jt-title-spacer { display:none; }
    #jovrel-document-rail .jt-inline .jt-tabrow { flex:1;min-width:260px;padding:0;border-bottom:0;background:var(--jt-surface); }
    #jovrel-document-rail .jt-inline .jt-tab { border-radius:9px; }
    #jovrel-document-rail .jt-inline .jt-tab.is-active { background:var(--tab-color);border:1px solid var(--tab-color); }
    #jovrel-document-rail .jt-inline .jt-tab-main { min-height:32px; }
    #jovrel-document-rail .jt-inline .jt-home { display:none; }
    @media(max-width:760px) { #jovrel-document-rail .jt-extra { display:none; }#jovrel-document-rail .jt-titlebar { flex-wrap:wrap; }#jovrel-document-rail .jt-title-spacer { min-width:0; }#jovrel-document-rail .jt-caption { min-width:90px; }#jovrel-document-rail .jt-caption button { min-width:30px; }#jovrel-document-rail .jt-brand { padding:0 4px; } }
    @media(max-width:520px) { #jovrel-document-rail .jt-stage { min-height:690px;padding:18px 4px; }#jovrel-document-rail .jt-content { padding:18px 12px; }#jovrel-document-rail .jt-titlebar .jt-utility { margin-left:auto; }#jovrel-document-rail .jt-caption { display:none; }#jovrel-document-rail .jt-file-menu-list { grid-template-columns:1fr; }#jovrel-document-rail .jt-tabrow { flex-wrap:wrap; }#jovrel-document-rail .jt-tab.is-active button:hover { background:color-mix(in srgb,var(--tab-color) 85%,var(--tab-on));color:var(--tab-on); }
    #jovrel-document-rail .jt-tab-name { font-size:12px; }#jovrel-document-rail .jt-home { display:none; }#jovrel-document-rail .jt-inline .jt-tabrow { min-width:0;flex-basis:100%; } }
    @media(pointer:coarse) { #jovrel-document-rail button { min-height:44px; }#jovrel-document-rail .jt-square,#jovrel-document-rail .jt-tab-close { min-width:44px;width:44px; } }
    @media(prefers-reduced-motion:reduce) { #jovrel-document-rail button { transition:none; } }
  </style>
  <div class="viz-carousel viz-dotted-background" aria-label="Top bar structure alternatives">
    <section data-variant="Document Rail" aria-label="Dedicated document tab row">
      <div class="jt-stage" data-design="rail"><div class="jt-window"><div class="jt-titlebar"><span class="jt-brand">Jovrel</span><div class="jt-divider" aria-hidden="true"></div><div class="jt-app-actions"><button type="button" class="cursor-interaction" data-command="File">File</button><button type="button" class="jt-secondary cursor-interaction" data-command="Open"><i data-lucide="folder-open" data-asset="open" aria-hidden="true"></i>Open</button><button type="button" class="jt-square cursor-interaction" data-command="Save" aria-label="Save active document" data-tooltip="Save active document"><i data-lucide="save" data-asset="save" aria-hidden="true"></i></button></div><div class="jt-title-spacer"></div><div class="jt-utility"><button type="button" class="cursor-interaction" data-command="Tools"><i data-lucide="search" data-asset="search" aria-hidden="true"></i>Tools</button><button type="button" class="jt-square jt-extra cursor-interaction" data-command="Print" aria-label="Print active document" data-tooltip="Print active document"><i data-lucide="printer" data-asset="print" aria-hidden="true"></i></button><button type="button" class="jt-square cursor-interaction" data-appmenu aria-expanded="false" aria-label="Application menu" data-tooltip="Application menu"><i data-lucide="ellipsis" aria-hidden="true"></i></button></div><div class="jt-caption" aria-label="Illustrative native window controls"><button type="button" disabled aria-label="Minimize illustration">−</button><button type="button" disabled aria-label="Maximize illustration">□</button><button type="button" disabled aria-label="Close window illustration">×</button></div></div><div class="jt-tabrow" data-tabrow></div><div class="jt-file-menu" data-menu hidden></div><div class="jt-content" data-content></div></div><div class="jt-status" role="status">Illustrative tabs · no documents modified</div></div>
    </section>
    <section data-variant="Compact Header" aria-label="Single-row alternative" hidden>
      <div class="jt-stage jt-inline" data-design="compact"><div class="jt-window"><div class="jt-titlebar"><span class="jt-brand">Jovrel</span><div class="jt-app-actions"><button type="button" class="jt-square cursor-interaction" data-command="Open" aria-label="Open document"><i data-lucide="folder-open" data-asset="open" aria-hidden="true"></i></button></div><div class="jt-tabrow" data-tabrow></div><div class="jt-utility"><button type="button" class="jt-square cursor-interaction" data-command="Tools" aria-label="Search all tools"><i data-lucide="search" data-asset="search" aria-hidden="true"></i></button><button type="button" class="jt-square cursor-interaction" data-appmenu aria-expanded="false" aria-label="Application menu"><i data-lucide="ellipsis" aria-hidden="true"></i></button></div><div class="jt-caption" aria-label="Illustrative native window controls"><button type="button" disabled aria-label="Minimize illustration">−</button><button type="button" disabled aria-label="Maximize illustration">□</button><button type="button" disabled aria-label="Close window illustration">×</button></div></div><div class="jt-file-menu" data-menu hidden></div><div class="jt-content" data-content></div></div><div class="jt-status" role="status">Illustrative tabs · no documents modified</div></div>
    </section>
  </div>
  <script>
    (()=>{
      const root=document.getElementById('jovrel-document-rail');
      const tabPalette=["#7050D6", "#086D91", "#A94430", "#16745F", "#AB386C", "#4C62BF", "#8A5B12", "#416A2B", "#8B46A3", "#276976", "#9B4260", "#5653A3"];const tabPaletteDark=["#B9A4FF", "#69D3F5", "#FFAE95", "#74DFC0", "#FF9BCD", "#A6BAFF", "#E9C077", "#B8D88B", "#D6A5ED", "#8DD5DD", "#F4A7BB", "#B5B0F5"];function tabStyle(t){const n=Number(t.id.split('-')[1])-1;const i=n%tabPalette.length;const c=tabPalette[i],d=tabPaletteDark[i];return `--tab-color:light-dark(${c},${d});--tab-on:light-dark(#ffffff,#171a21);--tab-tint:light-dark(color-mix(in srgb,${c} 20%,#ffffff),color-mix(in srgb,${d} 20%,#20232b))`; }
      const glyph=(name,asset='')=>`<i data-lucide="${name}" data-asset="${asset}" aria-hidden="true"></i>`;
      const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
      root.querySelectorAll('[data-design]').forEach(stage=>{
        let tabs=[{id:'doc-1',name:'long.pdf',dirty:false},{id:'doc-2',name:'form.pdf',dirty:true},{id:'doc-3',name:'New tab',dirty:false}];let active='doc-2',sequence=3,menuOpener=null;
        const row=stage.querySelector('[data-tabrow]'),menu=stage.querySelector('[data-menu]'),status=stage.querySelector('.jt-status'),content=stage.querySelector('[data-content]');
        function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.65}});}
        function announce(text){status.textContent=text+' · preview only';}
        function closeMenu(){menu.hidden=true;stage.querySelectorAll('[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'));}
        function render(){
          const width=row.getBoundingClientRect().width;const capacity=Math.max(1,Math.floor((width-144)/150));
          let visible=tabs.slice(0,capacity);const current=tabs.find(t=>t.id===active);if(current&&!visible.some(t=>t.id===active)){visible=visible.slice(0,Math.max(0,capacity-1)).concat(current);}
          row.innerHTML=`<button type="button" class="jt-home cursor-interaction ${active==='home'?'is-active':''}" data-home aria-label="Home">Home</button><div class="jt-tablist" aria-label="Open documents">${visible.map(t=>`<div class="jt-tab ${t.id===active?'is-active':''}" style="${tabStyle(t)}"><button type="button" class="jt-tab-main cursor-interaction" data-select="${t.id}" aria-pressed="${t.id===active}" aria-label="${esc(t.name)}${t.dirty?', unsaved changes':''}" data-tooltip="${esc(t.name)}${t.dirty?' · Unsaved changes':''}">${glyph(t.name.startsWith('New tab')?'file-plus-2':'file-text','pages')}<span class="jt-tab-name">${esc(t.name)}</span>${t.dirty?'<span class="jt-dirty" aria-hidden="true"></span>':''}</button><button type="button" class="jt-tab-close cursor-interaction" data-close="${t.id}" aria-label="Close ${esc(t.name)}">${glyph('x','close')}</button></div>`).join('')}</div><div class="jt-tab-actions"><button type="button" class="jt-square cursor-interaction" data-add aria-label="New tab" data-tooltip="New tab">${glyph('plus','plus')}</button><button type="button" class="cursor-interaction" data-all aria-expanded="false" aria-label="All ${tabs.length} tabs">${glyph('list','list')}<span class="jt-list-count">${tabs.length}</span></button></div>`;
          const currentName=current?.name||'Home';
          content.innerHTML=`<div class="jt-contextline"><span>${esc(currentName)}</span><span>${current?.dirty?'Unsaved changes (example)':''}</span></div><div class="jt-paper"><h3>${active==='home'||currentName.startsWith('New tab')?'Your documents':currentName==='form.pdf'?'TFlex Application Form':'TFlex Technical Report'}</h3><p>${active==='home'||currentName.startsWith('New tab')?'Open a document or choose a sample to begin.':'Document content stays the focal point. Each tab retains its own session.'}</p></div>`;
          row.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{active=b.dataset.select;closeMenu();render();announce('Selected '+tabs.find(t=>t.id===active).name);});
          row.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const target=tabs.find(t=>t.id===b.dataset.close);if(target.dirty){announce('Unsaved example: preserve the existing Save / Discard / Cancel close flow');return;}const index=tabs.findIndex(t=>t.id===target.id);tabs=tabs.filter(t=>t.id!==target.id);if(active===target.id)active=tabs[Math.min(index,tabs.length-1)]?.id||'home';closeMenu();render();announce('Closed '+target.name+' example');});
          row.querySelector('[data-home]').onclick=()=>{active='home';closeMenu();render();announce('Home selected without closing documents');};
          row.querySelector('[data-add]').onclick=()=>{sequence++;const tab={id:'doc-'+sequence,name:'New tab '+sequence,dirty:false};tabs.push(tab);active=tab.id;closeMenu();render();announce('Independent empty tab added');};
          row.querySelector('[data-all]').onclick=()=>{
            if(!menu.hidden){closeMenu();return;}menuOpener=row.querySelector('[data-all]');menu.hidden=false;menuOpener.setAttribute('aria-expanded','true');menu.innerHTML=`<h3>All tabs · ${tabs.length}</h3><div class="jt-file-menu-list">${tabs.map(t=>`<button type="button" class="jt-list-entry cursor-interaction" style="${tabStyle(t)};border-left:3px solid var(--tab-color)" data-jump="${t.id}">${glyph('file-text','pages')}<span class="jt-entry-name">${esc(t.name)}<span class="jt-entry-detail">${t.id===active?' · Active':''}${t.dirty?' · Unsaved':''}</span></span></button>`).join('')}</div>`;menu.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{active=b.dataset.jump;closeMenu();render();announce('Selected tab from complete list');});icons();
          };
          icons();
        }
        stage.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>announce(b.dataset.command+' routes to the existing command'));
        stage.querySelector('[data-appmenu]').onclick=()=>{
          closeMenu();menuOpener=stage.querySelector('[data-appmenu]');menu.hidden=false;menuOpener.setAttribute('aria-expanded','true');menu.innerHTML='<h3>Application menu</h3><div class="jt-file-menu-list">'+['Save as…','Print','Panels','Appearance','Settings','Sign in'].map(label=>`<button type="button" class="cursor-interaction" data-item="${label}">${label}</button>`).join('')+'</div>';menu.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{closeMenu();announce(b.dataset.item+' uses its existing handler');});
        };
        stage.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){closeMenu();menuOpener?.focus();}});
        const observer=new ResizeObserver(()=>{if(menu.hidden)render();});observer.observe(row);render();
        if(globalThis.Tweak){const config={accentWidth:2};const tweak=new Tweak({container:stage,onChange:()=>{stage.style.setProperty('--jt-keyline',config.accentWidth+'px');}});tweak.addSlider(config,'accentWidth',{label:'Active tab keyline',min:2,max:4,unit:'px'});}
      });
    })();
  </script>
</div>
