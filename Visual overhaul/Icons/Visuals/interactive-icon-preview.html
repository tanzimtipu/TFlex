const theme=document.getElementById('theme'),weight=document.getElementById('weight');theme.onclick=()=>{const on=document.body.classList.toggle('dark');theme.setAttribute('aria-pressed',on);theme.textContent=on?'Light preview':'Dark preview'};weight.onclick=()=>{const on=weight.getAttribute('aria-pressed')!=='true';weight.setAttribute('aria-pressed',on);document.querySelectorAll('.grid svg').forEach(s=>s.setAttribute('stroke-width',on?'1.8':'1.65'))};document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.grid button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.getElementById('status').textContent='Selected: '+b.dataset.name.replaceAll('-',' ')})
</script></body></html>
