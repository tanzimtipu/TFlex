<div id="jr-navigator-concepts" class="viz-carousel viz-dotted-background" aria-label="Jovrel document navigation designs">

      <div class="jn-section-title"><strong>Outline · 8</strong></div><div class="jn-outline" data-outline></div>
      <footer><span data-location>Viewing page 4 of 34</span></footer><div class="jn-command" data-command hidden></div>

</div>
<style>
#jr-navigator-concepts{--jn-surface:light-dark(#fff,#20232b);--jn-canvas:light-dark(#f5f6f8,#171a21);--jn-ink:light-dark(#485164,#b8c0d0);--jn-strong:light-dark(#232a38,#eef1f7);--jn-muted:light-dark(#667085,#929bac);--jn-border:light-dark(#e1e4eb,#3b414e);--jn-violet:light-dark(#7050d6,#b9a4ff);--jn-soft:light-dark(#f0ebfc,#302740);--jn-danger:light-dark(#b82e43,#ff9aad);--jn-paper:light-dark(#fff,#fff);--jn-print:light-dark(#3d4350,#3d4350);font:13px 'Segoe UI Variable','Segoe UI',sans-serif;color:var(--jn-ink)}
#jr-navigator-concepts *{box-sizing:border-box}#jr-navigator-concepts [hidden]{display:none!important}
#jr-navigator-concepts .jn-stage{min-height:960px;display:flex;justify-content:center;align-items:flex-start;padding:28px 8px 20px}
#jr-navigator-concepts .jn-panel{width:280px;max-width:100%;background:var(--jn-surface);border:1px solid var(--jn-border);border-radius:14px;box-shadow:0 12px 32px light-dark(#232a3810,#00000030);position:relative;overflow:clip}
#jr-navigator-concepts header{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--jn-border)}
#jr-navigator-concepts strong{font-weight:500;color:var(--jn-strong)}#jr-navigator-concepts header strong{font-size:16px}
#jr-navigator-concepts button{font:inherit;color:var(--jn-ink);background:transparent;border:0;border-radius:8px;min-height:32px;padding:6px 8px}
#jr-navigator-concepts button:hover{background:var(--jn-canvas)}#jr-navigator-concepts .jn-icon{width:32px;display:inline-flex;align-items:center;justify-content:center;padding:7px}#jr-navigator-concepts .jn-icon svg{width:18px;height:18px;stroke-width:1.65}
#jr-navigator-concepts .jn-tabs{display:flex;margin:12px 12px 0;padding:3px;background:var(--jn-canvas);border-radius:9px;gap:4px}#jr-navigator-concepts .jn-tabs button{flex:1;display:flex;justify-content:center;gap:10px;align-items:center}#jr-navigator-concepts .jn-tabs button[aria-pressed=true]{background:var(--jn-surface);color:var(--jn-violet);box-shadow:0 1px 4px light-dark(#232a3810,#00000030)}#jr-navigator-concepts .jn-tabs span{font-size:12px;font-variant-numeric:tabular-nums}
#jr-navigator-concepts .jn-summary,#jr-navigator-concepts .jn-section-title{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px;gap:6px}#jr-navigator-concepts [data-count]{color:var(--jn-violet)}#jr-navigator-concepts [data-clear]{font-size:12px;color:var(--jn-muted)}
#jr-navigator-concepts .jn-pages{padding:0 12px 12px;display:grid;gap:8px}#jr-navigator-concepts .jn-card{position:relative;border:1px solid transparent;border-radius:10px;padding:10px;background:var(--jn-canvas)}#jr-navigator-concepts .jn-card.jn-selected{background:var(--jn-soft)}#jr-navigator-concepts .jn-card.jn-current:before{content:'';position:absolute;top:12px;bottom:12px;left:0;width:3px;background:var(--jn-violet);border-radius:3px}
#jr-navigator-concepts .jn-preview-button{display:block;width:100%;padding:0;background:transparent!important}#jr-navigator-concepts .jn-paper{display:block;width:118px;aspect-ratio:0.707;margin:0 auto;background:var(--jn-paper);box-shadow:0 2px 7px #00000010;padding:14px 12px;color:var(--jn-print)}#jr-navigator-concepts .jn-paper b{display:block;height:4px;width:84%;margin-bottom:10px;background:var(--jn-print);opacity:.65}#jr-navigator-concepts .jn-paper em{display:block;height:2px;margin:4px 0;background:var(--jn-print);opacity:.28}#jr-navigator-concepts .jn-paper em:nth-child(4n){width:78%}
#jr-navigator-concepts .jn-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:4px}#jr-navigator-concepts .jn-card-footer label{display:flex;align-items:center;gap:7px;min-height:32px}#jr-navigator-concepts input[type=checkbox]{accent-color:var(--jn-violet);width:15px;height:15px;margin:0}#jr-navigator-concepts .jn-viewing{font-size:11px;color:var(--jn-violet);display:block;margin-left:22px}#jr-navigator-concepts .jn-outline{padding:8px 12px 12px;min-height:690px}#jr-navigator-concepts .jn-outline-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--jn-muted)}
#jr-navigator-concepts .jn-row{display:flex;align-items:center;gap:4px;border-radius:9px;padding:3px 4px;min-height:56px;margin:3px 0}#jr-navigator-concepts .jn-row.jn-current{background:var(--jn-soft)}#jr-navigator-concepts .jn-bookmark{flex:1;min-width:0;text-align:left;padding:6px 4px;display:flex;align-items:center;gap:8px}#jr-navigator-concepts .jn-bookmark svg{width:16px;height:16px;flex-shrink:0;color:var(--jn-muted)}#jr-navigator-concepts .jn-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}#jr-navigator-concepts .jn-dest{width:24px;flex-shrink:0;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--jn-muted)}#jr-navigator-concepts .jn-row.jn-current .jn-title{color:var(--jn-violet)}
#jr-navigator-concepts footer{padding:13px 16px;border-top:1px solid var(--jn-border);color:var(--jn-muted);font-size:12px}#jr-navigator-concepts .jn-command{position:absolute;z-index:4;left:12px;right:12px;top:58px;background:var(--jn-surface);border:1px solid var(--jn-border);border-radius:12px;box-shadow:0 12px 32px light-dark(#232a3820,#00000050);padding:8px}#jr-navigator-concepts .jn-command strong{display:block;padding:8px;font-size:12px}#jr-navigator-concepts .jn-command button{display:block;width:100%;text-align:left}#jr-navigator-concepts .jn-command button[data-danger]{color:var(--jn-danger)}#jr-navigator-concepts .jn-command hr{border:0;border-top:1px solid var(--jn-border);margin:6px 4px}
#jr-navigator-concepts .jn-split{width:380px}#jr-navigator-concepts .jn-split .jn-pages{grid-template-columns:repeat(2,minmax(0,1fr))}#jr-navigator-concepts .jn-split .jn-paper{width:100px}#jr-navigator-concepts .jn-split .jn-outline{min-height:0}#jr-navigator-concepts .jn-split .jn-row{min-height:44px}#jr-navigator-concepts .jn-split .jn-outline-head{display:none}#jr-navigator-concepts .jn-divider{height:12px;border-top:1px solid var(--jn-border);display:flex;justify-content:center;align-items:center;background:var(--jn-canvas)}#jr-navigator-concepts .jn-divider span{width:28px;height:3px;border-radius:3px;background:var(--jn-border)}
@media(max-width:390px){#jr-navigator-concepts .jn-split .jn-pages{grid-template-columns:1fr}#jr-navigator-concepts .jn-split .jn-paper{width:118px}#jr-navigator-concepts .jn-stage{min-height:1190px}#jr-navigator-concepts .jn-split{width:280px}}
@media(pointer:coarse){#jr-navigator-concepts button,#jr-navigator-concepts .jn-card-footer label{min-height:44px}#jr-navigator-concepts .jn-icon{width:44px}#jr-navigator-concepts .jn-stage{min-height:1000px}}
</style>
<script>
(()=>{const root=document.getElementById('jr-navigator-concepts');
root.querySelectorAll('.jn-panel').forEach(panel=>{let current=4,selected=new Set([2]),view='pages',menuOpener=null;const split=panel.dataset.layout==='split';const nums=split?[2,4]:[2,3,4];const pages=panel.querySelector('[data-pages]'),outline=panel.querySelector('[data-outline]'),command=panel.querySelector('[data-command]');
pages.innerHTML=nums.map(n=>`<div class="jn-card" data-page="${n}"><button type="button" class="jn-preview-button cursor-interaction" data-navigate="${n}" aria-label="View page ${n}"><span class="jn-paper" aria-hidden="true"><b></b>${'<em></em>'.repeat(20)}</span></button><div class="jn-card-footer"><label class="cursor-interaction"><input type="checkbox" data-select="${n}" aria-label="Select page ${n} for batch actions"><span>Page ${n}</span></label><button type="button" class="jn-icon cursor-interaction" data-more-page="${n}" aria-label="Actions for page ${n}"><i data-lucide="ellipsis" data-asset="more" aria-hidden="true"></i></button></div><span class="jn-viewing" data-viewing hidden>Viewing</span></div>`).join('');
outline.innerHTML='<div class="jn-outline-head"><span>Bookmarks</span><button type="button" class="cursor-interaction" data-add>Add bookmark</button></div>'+Array.from({length:8},(_,i)=>{const n=(i+1)*2,title=`Chapter ${i+1}: The Art of Orchestration`;return `<div class="jn-row" data-destination="${n}"><button type="button" class="jn-bookmark cursor-interaction" data-navigate="${n}" aria-label="${title}, page ${n}" data-tooltip="${title}"><i data-lucide="bookmark" data-asset="outline" aria-hidden="true"></i><span class="jn-title">${title}</span></button><span class="jn-dest">${n}</span><button type="button" class="jn-icon cursor-interaction" data-more-bookmark="${n}" aria-label="Bookmark actions, chapter ${i+1}"><i data-lucide="ellipsis" data-asset="more" aria-hidden="true"></i></button></div>`;}).join('');
function render(){panel.querySelector('[data-count]').textContent=selected.size?`${selected.size} selected`:'No selection';panel.querySelector('[data-clear]').disabled=!selected.size;panel.querySelector('[data-location]').textContent=`Viewing page ${current} of 34`;pages.querySelectorAll('[data-page]').forEach(c=>{const n=+c.dataset.page;c.classList.toggle('jn-current',n===current);c.classList.toggle('jn-selected',selected.has(n));c.querySelector('[data-select]').checked=selected.has(n);c.querySelector('[data-viewing]').hidden=n!==current;c.querySelector('[data-navigate]').setAttribute('aria-current',n===current?'page':'false');});outline.querySelectorAll('[data-destination]').forEach(r=>r.classList.toggle('jn-current',+r.dataset.destination===current));if(!split){pages.hidden=view!=='pages';outline.hidden=view!=='outline';panel.querySelector('.jn-summary').hidden=view!=='pages';panel.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));}}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:split?'Split Navigator':'Document Navigator',currentPage:current,selectedPages:[...selected],view},privateContent:null}).catch(()=>{});}
function menu(title,actions){command.hidden=false;const anchor=menuOpener?.getBoundingClientRect(),bounds=panel.getBoundingClientRect();command.style.top=Math.max(58,Math.min(anchor?anchor.bottom-bounds.top+4:58,bounds.height-330))+'px';command.innerHTML=`<strong>${title}</strong>`+actions.map(a=>a==='|'?'<hr>':`<button type="button" class="cursor-interaction" ${a.startsWith('Delete')||a.startsWith('Remove')?'data-danger':''}>${a}</button>`).join('')+'<hr><button type="button" class="cursor-interaction" data-dismiss>Close</button>';command.querySelector('[data-dismiss]').onclick=()=>{command.hidden=true;menuOpener?.focus();};command.querySelector('[data-dismiss]').focus();}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.morePage||b.dataset.moreBookmark||b.hasAttribute('data-panel-menu')||b.hasAttribute('data-add'))menuOpener=b;if(b.dataset.view){view=b.dataset.view;command.hidden=true;render();save();}if(b.hasAttribute('data-clear')){selected.clear();render();save();}if(b.dataset.navigate){current=+b.dataset.navigate;if(b.closest('.jn-card'))selected=new Set([current]);command.hidden=true;render();save();}if(b.dataset.morePage)menu(`Page ${b.dataset.morePage} actions`,['Rotate clockwise','Extract this page','|','Delete this page']);if(b.dataset.moreBookmark)menu('Bookmark actions',['Rename','Set destination…','Add bookmark','Indent','Outdent','|','Delete bookmark']);if(b.hasAttribute('data-panel-menu'))menu('Navigator actions',['Use split layout','Combine with another PDF','|','Remove blank pages']);if(b.hasAttribute('data-add'))menu('Bookmark actions',['Add bookmark at current view']);});
panel.addEventListener('change',e=>{if(e.target.dataset.select){const n=+e.target.dataset.select;e.target.checked?selected.add(n):selected.delete(n);render();save();}});panel.addEventListener('keydown',e=>{if(e.key==='Escape'){command.hidden=true;menuOpener?.focus();}});function restore(snapshot){const x=snapshot?.modelContent;if(!x||x.design!==(split?'Split Navigator':'Document Navigator'))return;if(Number.isInteger(x.currentPage)&&x.currentPage>=1&&x.currentPage<=34)current=x.currentPage;if(Array.isArray(x.selectedPages))selected=new Set(x.selectedPages.filter(n=>Number.isInteger(n)&&n>=1&&n<=34));if(['pages','outline'].includes(x.view))view=x.view;render();}restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));render();
if(globalThis.Tweak){const settings={previewWidth:split?100:118};const tweak=new Tweak({container:panel,onChange:()=>panel.querySelectorAll('.jn-paper').forEach(p=>p.style.width=settings.previewWidth+'px')});tweak.addSlider(settings,'previewWidth',{label:'Paper preview width',min:96,max:144,step:4,unit:'px'});}
});if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
