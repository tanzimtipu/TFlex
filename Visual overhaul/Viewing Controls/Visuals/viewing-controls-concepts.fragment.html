<div id="jovrel-view-strip" aria-label="Jovrel viewing control concepts">
  <style>
    #jovrel-view-strip { --jv-surface:light-dark(#fff,#20232b);--jv-canvas:light-dark(#f5f6f8,#171a21);--jv-ink:light-dark(#485164,#b8c0d0);--jv-border:light-dark(#e1e4eb,#3b414e);--jv-accent:light-dark(#7050d6,#b9a4ff);--jv-soft:light-dark(#f0ebfc,#302740);font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;color:var(--jv-ink); }
    #jovrel-view-strip * { box-sizing:border-box; }#jovrel-view-strip [hidden] { display:none!important; }
    #jovrel-view-strip .jv-stage { padding:54px 8px 24px;min-height:460px; }
    #jovrel-view-strip .jv-context { padding:24px;background:var(--jv-canvas);border:1px solid var(--jv-border);border-radius:12px;min-height:220px;display:grid;gap:24px;align-content:space-between; }
    #jovrel-view-strip .jv-document { text-align:center;font-size:12px; }
    #jovrel-view-strip .jv-strip { display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;background:var(--jv-surface);border:1px solid var(--jv-border);border-radius:12px; }
    #jovrel-view-strip button { display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:6px 8px;background:transparent;border:1px solid transparent;border-radius:8px;color:inherit;font:500 12px 'Segoe UI',sans-serif; }
    #jovrel-view-strip button:hover { background:var(--jv-canvas); }#jovrel-view-strip button[aria-pressed=true] { background:var(--jv-soft);color:var(--jv-accent); }#jovrel-view-strip button:disabled { opacity:.55; }
    #jovrel-view-strip [data-lucide],#jovrel-view-strip .jv-vector { width:16px;height:16px;stroke-width:1.65; }
    #jovrel-view-strip .jv-group { display:flex;align-items:center;gap:4px;flex-wrap:wrap; }
    #jovrel-view-strip .jv-space { flex:1; }
    #jovrel-view-strip input,#jovrel-view-strip select { font:14px 'Segoe UI',sans-serif;background:var(--jv-surface);color:var(--jv-ink);border:1px solid var(--jv-border);border-radius:7px;padding:6px;max-width:100%;min-width:0; }
    #jovrel-view-strip input { width:42px;text-align:center;font-variant-numeric:tabular-nums; }
    #jovrel-view-strip select { width:104px;font-size:12px; }
    #jovrel-view-strip .jv-total { font-size:12px;font-variant-numeric:tabular-nums; }
    #jovrel-view-strip .jv-error { font-size:12px;color:light-dark(#b82e43,#ff9aad);margin-top:12px; }
    #jovrel-view-strip .jv-status { font-size:12px;margin-top:14px;min-height:20px; }
    #jovrel-view-strip .jv-split .jv-strip { justify-content:space-between; }#jovrel-view-strip .jv-split .jv-mode-group { flex-basis:100%;border-bottom:1px solid var(--jv-border);padding-bottom:6px; }
    @media(max-width:520px) { #jovrel-view-strip .jv-context { padding:14px; }#jovrel-view-strip .jv-strip { gap:12px; }#jovrel-view-strip .jv-space { display:none; }#jovrel-view-strip .jv-stage { min-height:560px; } }
    @media(pointer:coarse) { #jovrel-view-strip button { min-width:44px;min-height:44px; } }
  </style>
  <div class="viz-carousel viz-dotted-background" aria-label="Viewing control arrangements">
    <section data-variant="View Strip"><div class="jv-stage" data-design="strip"><div class="jv-context"><div class="jv-document">report.pdf · viewing controls</div><div class="jv-strip" data-controls></div></div><div class="jv-error" role="alert" hidden></div><div class="jv-status" role="status">Page 1 · Fit page · Single page</div></div></section>
    <section data-variant="Separated Groups" hidden><div class="jv-stage jv-split" data-design="groups"><div class="jv-context"><div class="jv-document">report.pdf · viewing controls</div><div class="jv-strip" data-controls></div></div><div class="jv-error" role="alert" hidden></div><div class="jv-status" role="status">Page 1 · Fit page · Single page</div></div></section>
  </div>
  <script>(()=>{const root=document.getElementById('jovrel-view-strip');root.querySelectorAll('[data-design]').forEach(stage=>{let page=1,mode='single',zoom='fit';const controls=stage.querySelector('[data-controls]'),status=stage.querySelector('.jv-status'),error=stage.querySelector('.jv-error');controls.innerHTML='<div class="jv-group"><button type="button" class="cursor-interaction" data-prev aria-label="Previous page"><i data-lucide="chevron-left" data-asset="previous" aria-hidden="true"></i></button><input data-page value="1" inputmode="numeric" aria-label="Page number"><span class="jv-total">/ 34</span><button type="button" class="cursor-interaction" data-next aria-label="Next page"><i data-lucide="chevron-right" data-asset="next" aria-hidden="true"></i></button></div><div class="jv-space"></div><div class="jv-group"><select data-zoom aria-label="Zoom"><option value="fit">Fit page</option><option value="width">Fit width</option><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option></select></div><div class="jv-group jv-mode-group"><button type="button" class="cursor-interaction" data-mode="single" aria-pressed="true" aria-label="Single page" data-tooltip="Single page"><i data-lucide="rectangle-vertical" data-asset="single-page" aria-hidden="true"></i></button><button type="button" class="cursor-interaction" data-mode="spread" aria-pressed="false" aria-label="Two-page spread" data-tooltip="Two-page spread"><i data-lucide="columns-2" data-asset="two-page" aria-hidden="true"></i></button><button type="button" class="cursor-interaction" data-mode="grid" aria-pressed="false" aria-label="Page grid" data-tooltip="Page grid"><i data-lucide="grid-2x2" data-asset="grid" aria-hidden="true"></i></button><button type="button" class="cursor-interaction" data-pan aria-pressed="false" aria-label="Pan tool" data-tooltip="Pan tool"><i data-lucide="hand" data-asset="pan" aria-hidden="true"></i></button></div>';function render(){controls.querySelector('[data-page]').value=page;controls.querySelector('[data-prev]').disabled=page===1;controls.querySelector('[data-next]').disabled=page===34;controls.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));status.textContent='Page '+page+' · '+controls.querySelector('[data-zoom]').selectedOptions[0].text+' · '+{single:'Single page',spread:'Two-page spread',grid:'Page grid'}[mode]+' · preview only';}controls.querySelector('[data-prev]').onclick=()=>{page=Math.max(1,page-1);render();};controls.querySelector('[data-next]').onclick=()=>{page=Math.min(34,page+1);render();};const input=controls.querySelector('[data-page]');const commit=()=>{const n=Number(input.value);const valid=/^\d+$/.test(input.value)&&n>=1&&n<=34;error.hidden=valid;input.setAttribute('aria-invalid',String(!valid));error.textContent='Enter a page from 1 to 34.';if(valid){page=n;render();}};input.onchange=commit;input.onkeydown=e=>{if(e.key==='Enter')commit();};controls.querySelector('[data-zoom]').onchange=()=>{zoom=controls.querySelector('[data-zoom]').value;render();};controls.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});controls.querySelector('[data-pan]').onclick=e=>e.currentTarget.setAttribute('aria-pressed',String(e.currentTarget.getAttribute('aria-pressed')!=='true'));render();});if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});})();</script>
</div>
