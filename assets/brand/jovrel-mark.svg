<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <!-- deep-blue squircle tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <!-- linework J: three parallel strokes, stem -> hook sweep -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round">
    <!-- inner stroke -->
    <path d="M 556 240 L 556 578 A 105 105 0 0 1 403 605"/>
    <!-- middle stroke -->
    <path d="M 609 240 L 609 578 A 158 158 0 0 1 398 630"/>
    <!-- outer stroke -->
    <path d="M 662 240 L 662 578 A 211 211 0 0 1 393 655"/>
  </g>
</svg>
